name: Build and publish Docker image

# Builds this fork of Posterr and publishes it to the GitHub Container
# Registry (GHCR) so Unraid can pull it like any other image.
# Published as: ghcr.io/<your-github-user>/posterr with tags
# "dual-plex" (always the latest build of this branch), the branch
# name, and the commit SHA.

on:
  push:
    branches: ["dual-plex-now-screening"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/posterr
          tags: |
            dual-plex
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
